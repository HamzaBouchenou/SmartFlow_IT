# ADR-01 (docs/DECISIONS.md) - "Front-end et back-end servis sous la même origine via le
# reverse proxy du docker-compose.yml, pour que le cookie soit envoyé sans configuration
# CORS permissive." Ce serveur nginx est ce reverse proxy : il sert le SPA construit et
# transmet tout ce qui n'est pas un fichier statique au service `api` du même
# docker-compose.yml, sur le même host:port que celui vu par le navigateur.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # §11.1 - API REST sous /api/v1 ; §11.2 - le cookie de session et le cookie CSRF
    # (ADR-01) circulent sans réglage CORS puisque le navigateur ne voit qu'une seule
    # origine (celle de ce serveur). proxy_pass ne réécrit ni Set-Cookie ni son Domain
    # ici : nginx et l'API partagent déjà le même host:port côté navigateur.
    location /api/ {
        # RG-09/§6.10 - nginx's own default (1M) is far below the application's actual
        # policy (spring.servlet.multipart.max-file-size=20MB ; RG-09's
        # attachments.max-size-bytes, admin-configurable, defaults to 10MB) : found in
        # recette (REC-SCN-30) - a legitimate attachment between 1MB and 10MB was silently
        # rejected by nginx itself as a raw 413 HTML page, never even reaching
        # AttachmentValidationRule's own clean FILE_TOO_LARGE JSON error. Set to match
        # Spring's own cap exactly, so nginx is never the more restrictive gate - the real
        # business limit stays enforced once, server-side, in AttachmentService.
        client_max_body_size 20m;
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # §11.1 - documentation OpenAPI disponible en développement (SecurityConfig la laisse
    # publique) : utile depuis le même navigateur que le SPA sans reconfigurer CORS.
    location ~ ^/(v3/api-docs|swagger-ui) {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    # SPA : toute route côté client (React Router à venir) qui ne correspond à aucun
    # fichier statique retombe sur index.html plutôt qu'un 404 nginx.
    #
    # §13 - ligne "XSS / CSRF" : ces en-têtes protègent le document que le navigateur
    # évalue réellement (le SPA construit par Vite, jamais du HTML inline ni de style
    # inline - vérifié sur dist/index.html), contrairement au Content-Security-Policy déjà
    # posé par SecurityConfig côté back-end qui ne couvre, lui, que les réponses JSON de
    # /api/**. Volontairement scopés à ce seul `location /` (pas au niveau du `server`) pour
    # ne pas se superposer aux en-têtes déjà émis par le back-end sur /api/** en amont.
    location / {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        try_files $uri /index.html;
    }
}
