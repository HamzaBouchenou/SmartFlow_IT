# ADR-01 (docs/DECISIONS.md) - "Front-end et back-end servis sous la même origine via le
# reverse proxy du docker-compose.yml, pour que le cookie soit envoyé sans configuration
# CORS permissive." Ce serveur nginx est ce reverse proxy : il sert le SPA construit et
# transmet tout ce qui n'est pas un fichier statique au service `api` du même
# docker-compose.yml, sur le même host:port que celui vu par le navigateur.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # §11.1 - API REST sous /api/v1 ; §11.2 - le cookie de session et le cookie CSRF
    # (ADR-01) circulent sans réglage CORS puisque le navigateur ne voit qu'une seule
    # origine (celle de ce serveur). proxy_pass ne réécrit ni Set-Cookie ni son Domain
    # ici : nginx et l'API partagent déjà le même host:port côté navigateur.
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # §11.1 - documentation OpenAPI disponible en développement (SecurityConfig la laisse
    # publique) : utile depuis le même navigateur que le SPA sans reconfigurer CORS.
    location ~ ^/(v3/api-docs|swagger-ui) {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    # SPA : toute route côté client (React Router à venir) qui ne correspond à aucun
    # fichier statique retombe sur index.html plutôt qu'un 404 nginx.
    location / {
        try_files $uri /index.html;
    }
}
