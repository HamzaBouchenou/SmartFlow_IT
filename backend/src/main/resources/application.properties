spring.application.name=backend
spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
# §15.3 - "niveaux de log configurables". Le journal SQL est un niveau de log comme un
# autre : utile pour diagnostiquer en développement, pur bruit (et une ligne par requête)
# en recette. Désactivé par défaut, réactivable sans reconstruire l'image.
spring.jpa.show-sql=${SHOW_SQL:false}

# RG-07 - fréquence du balayage planifié qui recalcule le modèle SLA matérialisé sur
# Request (infrastructure/scheduler/SlaSweepScheduler). 60s par défaut, adapté à la
# volumétrie du PFA.
smartflow.sla.sweep-interval-ms=60000

# RG-12/ADR-15 (docs/DECISIONS.md) - fréquence du balayage d'archivage
# (infrastructure/scheduler/RequestArchivalScheduler). 1h par défaut : contrairement au SLA,
# la granularité de rétention est le mois, une cadence minute par minute serait sans objet.
smartflow.archival.sweep-interval-ms=3600000

# §15.3 - "Logs centralisables et niveaux de log configurables". Les journaux partent sur
# la sortie standard (le conteneur ne les écrit dans aucun fichier) : c'est ce qui les rend
# collectables par `docker compose logs` comme par n'importe quel agent de centralisation,
# sans rotation à gérer dans l'image. Le niveau se règle par variable d'environnement, donc
# sans reconstruire ni redéployer l'application : LOG_LEVEL pour le code SmartFlow lui-même,
# LOG_LEVEL_ROOT pour tout le reste (Spring, Hibernate, le pool de connexions).
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.smartflow.backend=${LOG_LEVEL:INFO}

# §8 - "le traceId doit se retrouver dans les logs". TraceIdFilter (crosscutting/logging)
# puts the current request's traceId in the MDC under this key; %X{traceId:-} prints it on
# every log line for the request, and "-" if none is set (outside an HTTP request, e.g. the
# scheduled SLA sweep).
logging.pattern.level=%5p [traceId=%X{traceId:-}]

# ADR-01 (docs/DECISIONS.md) - session serveur portée par un cookie. http-only interdit la
# lecture du cookie de session en JavaScript (le jeton CSRF, lui, reste lisible : voir
# CookieCsrfTokenRepository dans crosscutting/security/SecurityConfig). same-site=lax laisse
# passer la navigation normale tout en bloquant l'envoi du cookie depuis un site tiers.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# ADR-01 exige "Secure" - un navigateur ne renvoie alors ce cookie que sur une connexion
# TLS, donc secure=true est le défaut ici. Aucun environnement de ce dépôt ne termine
# encore de TLS (§15.1 - développement, intégration, recette) : docker-compose.yml désactive
# explicitement cet attribut pour son propre environnement via SESSION_COOKIE_SECURE plutôt
# que de changer ce défaut pour tout le monde, y compris un futur déploiement avec TLS.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
# §6.1 "Expiration de session" - valeur de repli explicite plutôt qu'implicite (le défaut
# Servlet est aussi de 30 minutes, mais rien ne le disait ici). §6.10 range la durée des
# sessions parmi les paramètres généraux administrables : la valeur effective vient de la
# SystemParameter security.session.timeout-minutes, appliquée à chaque session créée par
# crosscutting/security/SessionTimeoutListener. Cette propriété ne sert donc que tant
# qu'aucune ligne n'a été posée par un administrateur.
server.servlet.session.timeout=30m

# RG-09/§13 - "stockage hors répertoire public" : répertoire jamais servi comme ressource
# statique, atteint uniquement par infrastructure/storage/AttachmentStorage. La liste
# blanche d'extensions et la taille maximale restent administrables (§6.10) via
# SystemParameter (voir AttachmentService.ALLOWED_EXTENSIONS_KEY/MAX_SIZE_BYTES_KEY), pas
# ici.
# Sans ATTACHMENTS_DIR (dev local, tests), un répertoire toujours inscriptible sous le tmp
# du système plutôt que /var/smartflow/attachments (docker-compose.yml le positionne
# explicitement pour le conteneur `api`, dont le volume nommé `attachments` cible ce
# chemin) - un chemin racine non inscriptible par défaut casserait tout démarrage local.
smartflow.attachments.storage-dir=${ATTACHMENTS_DIR:${java.io.tmpdir}/smartflow-attachments}

# Plafond du framework, volontairement au-dessus du défaut applicatif (10 Mo, voir
# AttachmentService) : la vraie limite métier reste RG-09/AttachmentValidationRule via
# SystemParameter ; ce plafond n'existe que pour éviter qu'une requête énorme sature la
# mémoire avant même d'atteindre cette règle.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# §6.8 - envoi d'e-mails pour les événements importants. Noms alignés sur les variables
# d'environnement déjà prévues par docker-compose.yml (SMARTFLOW_MAIL_HOST) plutôt que sur
# spring.mail.* : le JavaMailSender est construit manuellement (infrastructure/mail/MailConfig).
smartflow.mail.host=${SMARTFLOW_MAIL_HOST:localhost}
smartflow.mail.port=${SMARTFLOW_MAIL_PORT:1025}
smartflow.mail.from=${SMARTFLOW_MAIL_FROM:noreply@smartflow.local}

# §12/ADR-16 (docs/DECISIONS.md) - module IA. Noms alignés sur les variables d'environnement
# déjà prévues par docker-compose.yml (SMARTFLOW_AI_ENABLED/SMARTFLOW_AI_BASE_URL). Désactivé
# par défaut : un environnement qui ne positionne pas ces variables reste utilisable sans le
# service IA (§12.2), infrastructure/ai/AiClient refuse tout appel sans jamais le tenter.
smartflow.ai.enabled=${SMARTFLOW_AI_ENABLED:false}
smartflow.ai.base-url=${SMARTFLOW_AI_BASE_URL:http://localhost:5000}
