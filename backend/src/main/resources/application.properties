spring.application.name=backend
spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# RG-07 - fréquence du balayage planifié qui recalcule le modèle SLA matérialisé sur
# Request (infrastructure/scheduler/SlaSweepScheduler). 60s par défaut, adapté à la
# volumétrie du PFA.
smartflow.sla.sweep-interval-ms=60000

# §8 - "le traceId doit se retrouver dans les logs". TraceIdFilter (crosscutting/logging)
# puts the current request's traceId in the MDC under this key; %X{traceId:-} prints it on
# every log line for the request, and "-" if none is set (outside an HTTP request, e.g. the
# scheduled SLA sweep).
logging.pattern.level=%5p [traceId=%X{traceId:-}]

# ADR-01 (docs/DECISIONS.md) - session serveur portée par un cookie. http-only interdit la
# lecture du cookie de session en JavaScript (le jeton CSRF, lui, reste lisible : voir
# CookieCsrfTokenRepository dans crosscutting/security/SecurityConfig). same-site=lax laisse
# passer la navigation normale tout en bloquant l'envoi du cookie depuis un site tiers.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# ADR-01 exige "Secure" - un navigateur ne renvoie alors ce cookie que sur une connexion
# TLS, donc secure=true est le défaut ici. Aucun environnement de ce dépôt ne termine
# encore de TLS (§15.1 - développement, intégration, recette) : docker-compose.yml désactive
# explicitement cet attribut pour son propre environnement via SESSION_COOKIE_SECURE plutôt
# que de changer ce défaut pour tout le monde, y compris un futur déploiement avec TLS.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
